[project]
name = "hass-reolink-thumbs"
version = "0.0.0"
description = "Development environment for the Reolink Thumbs custom component"
requires-python = ">=3.14.2"
dependencies = []

[tool.setuptools]
# Non-packageable project (see [tool.uv] package = false):
# disable automatic discovery, which makes node_modules irrelevant.
packages = []

[dependency-groups]
lint = ["prek"]
dev = [
  {include-group = "lint"},
  "pytest-homeassistant-custom-component",
  "pytest-asyncio",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra --cov=custom_components --cov-report=term-missing --cov-fail-under=85"
pythonpath = ["."]
testpaths = ["tests/"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
log_cli = true

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 88
fix = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.codespell]
skip = "./.*,*.csv,*.json,uv.lock"
quiet-level = 2
